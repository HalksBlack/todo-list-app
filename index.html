<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List - Aplicativo de Tarefas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 Minha Lista de Tarefas</h1>
            <p class="subtitle">Organize suas atividades diárias</p>
        </header>

        <main>
            <!-- Input Section -->
            <div class="input-section">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="taskInput" 
                        class="task-input" 
                        placeholder="Adicione uma nova tarefa..."
                        autocomplete="off"
                    >
                    <button id="addBtn" class="add-btn">+ Adicionar</button>
                </div>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">Todas</button>
                    <button class="filter-btn" data-filter="pending">Pendentes</button>
                    <button class="filter-btn" data-filter="completed">Concluídas</button>
                </div>
            </div>

            <!-- Stats Section -->
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Total:</span>
                    <span class="stat-value" id="totalCount">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Pendentes:</span>
                    <span class="stat-value" id="pendingCount">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Concluídas:</span>
                    <span class="stat-value" id="completedCount">0</span>
                </div>
            </div>

            <!-- Tasks List -->
            <div class="tasks-container">
                <ul id="taskList" class="task-list">
                    <!-- Tasks will be added here dynamically -->
                </ul>
                <div id="emptyState" class="empty-state">
                    <p>📭 Nenhuma tarefa por aqui!</p>
                    <p>Comece adicionando uma nova tarefa acima</p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button id="clearCompletedBtn" class="clear-btn">
                    🗑️ Limpar Concluídas
                </button>
                <button id="clearAllBtn" class="clear-all-btn">
                    ⚠️ Limpar Tudo
                </button>
            </div>
        </main>

        <footer>
            <p>💾 Suas tarefas são salvas automaticamente</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
